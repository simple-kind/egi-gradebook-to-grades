<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradebook Grader</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 48rem;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  #dropzone {
    border: 2px dashed #888;
    border-radius: 0.5rem;
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s;
  }
  #dropzone.dragover {
    background-color: rgba(100, 150, 255, 0.1);
    border-color: #4a90d9;
  }
  #fileInput { display: none; }
  #output {
    white-space: pre-wrap;
    background: rgba(128, 128, 128, 0.1);
    border-radius: 0.5rem;
    padding: 1rem;
    margin-top: 1rem;
    min-height: 2rem;
  }
  #copyBtn { margin-top: 0.5rem; display: none; }
  .error { color: #c0392b; }
  p.note { color: #666; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Gradebook Grader</h1>
  <p class="note">
    Drop a gradebook export CSV below. Everything runs locally in your browser —
    the file is never uploaded anywhere.
  </p>

  <div id="dropzone">
    Drag &amp; drop a CSV file here, or click to choose one
    <input type="file" id="fileInput" accept=".csv">
  </div>

  <pre id="output"></pre>
  <button id="copyBtn">Copy output</button>

  <script src="grader.js"></script>
  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    async function handleFile(file) {
      if (!file) return;
      try {
        const text = await file.text();
        output.textContent = gradeCSV(text) || '(no LT rows found in this file)';
        output.classList.remove('error');
        copyBtn.style.display = 'inline-block';
      } catch (err) {
        output.textContent = `Error reading file: ${err.message}`;
        output.classList.add('error');
        copyBtn.style.display = 'none';
      }
    }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

    dropzone.addEventListener('dragover', e => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(output.textContent);
    });

    if (location.search.includes('test=1')) runSelfTests();
  </script>
</body>
</html>
